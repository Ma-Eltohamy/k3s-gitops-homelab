apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"   # crds must exist before kube-prometheus-stack syncs
spec:
  project: k3s-homelab-project
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    targetRevision: 32.0.0    # appVersion v0.94.0, same CRDs, replacing the chart github repo with the chart repo 
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
