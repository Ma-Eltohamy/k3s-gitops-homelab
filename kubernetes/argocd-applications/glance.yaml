---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glance
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Ma-Eltohamy/k3s-homelab-gitops.git
    targetRevision: main
    path: kubernetes/apps/glance

  destination:
    server: https://kubernetes.default.svc
    namespace: glance

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
