---
# Argo CD's own install. Built by hand on a bare cluster, then synced by
# kubernetes/argocd-applications/argo-cd.yaml once Argo CD is running:
#
#   kubectl apply -k kubernetes/infrastructure/argo-cd --server-side
#
# --server-side is required, not cosmetic. Client-side apply stores a copy of
# each object in its own kubectl.kubernetes.io/last-applied-configuration
# annotation, and annotations cap at 262144 bytes. The Application CRD is
# larger than that, so a client-side apply fails with "metadata.annotations:
# Too long" on a cluster that has no Argo CD yet to help debug it.
#
# install.yaml is vendored rather than referenced as a remote base. A remote
# base makes every manifest render depend on reaching raw.githubusercontent.com,
# which is the same coupling the 2026-08-03 image-pin entry removed: a DNS
# fault stops being a network problem and silently becomes "nothing syncs".
# Vendoring also makes an upgrade a readable diff instead of a version bump.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - install.yaml
  - ingress.yaml

patches:
  - path: cm-patch.yaml
  - path: cmd-params-patch.yaml
